[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-dock"
version = "0.2.0"
description = "Python sidecar for the Manim Dock VS Code extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manim Dock contributors" }]
dependencies = [
  "libcst>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
manim-dock = "manim_dock.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manim_dock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
